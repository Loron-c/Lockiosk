name: Generate Keystore (一次性)

on:
  workflow_dispatch:

jobs:
  genkey:
    runs-on: ubuntu-latest
    steps:
      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v -keystore kiosk-release.jks \
            -alias kiosk -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kiosk2026 -keypass kiosk2026 \
            -dname "CN=Kiosk, OU=IT, O=Yichi, L=Fujian, ST=Fujian, C=CN"

      - name: 转成 base64
        run: base64 -w 0 kiosk-release.jks > keystore-b64.txt

      - name: 上传密钥文件
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            kiosk-release.jks
            keystore-b64.txt
          retention-days: 1
