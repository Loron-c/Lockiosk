name: Build Kiosk APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 签名密钥策略（防止每次构建签名不同 → 新版 APK 无法覆盖安装）：
      #   优先级 1：GitHub Secrets 的 KEYSTORE_B64（base64 编码的 jks）
      #   优先级 2：仓库根目录已提交的 kiosk-release.jks（私有仓库可用）
      #   都没有：直接失败并给出指引，绝不静默生成新密钥
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用 GitHub Secrets 中的固定签名密钥"
            echo "$KEYSTORE_B64" | base64 -d > kiosk-release.jks
          elif [ -f kiosk-release.jks ]; then
            echo "使用仓库中提交的签名密钥"
          else
            echo "::error::没有找到签名密钥。请配置 KEYSTORE_B64 Secret，或把 kiosk-release.jks 提交到私有仓库。"
            exit 1
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
