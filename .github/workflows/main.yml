name: Build Kiosk APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 签名密钥只从 GitHub Secrets 读取，绝不自动生成、绝不提交回仓库
      # （公开仓库里放过密钥会导致任何人可伪造本应用的安装包）
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用 GitHub Secrets 中的固定签名密钥"
            echo "$KEYSTORE_B64" | base64 -d > kiosk-release.jks
          else
            echo "::error::未找到 KEYSTORE_B64 Secret。请到 仓库 Settings → Secrets and variables → Actions 配置（内容为 kiosk-release.jks 的 base64 编码）。"
            exit 1
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
