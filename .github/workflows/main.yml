name: Build Kiosk APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "使用 GitHub Secrets 中的固定签名密钥"
            echo "$KEYSTORE_B64" | base64 -d > kiosk-release.jks
          elif [ -f kiosk-release.jks ]; then
            echo "使用仓库中已提交的固定签名密钥"
          else
            echo "首次构建：自动生成签名密钥并提交回仓库（此后固定不变）"
            keytool -genkeypair -v -keystore kiosk-release.jks \
              -alias kiosk -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass kiosk2026 -keypass kiosk2026 \
              -dname "CN=Kiosk, OU=IT, O=Yichi, L=Fujian, ST=Fujian, C=CN"
            git config user.name "kiosk-bot"
            git config user.email "kiosk-bot@local"
            git add -f kiosk-release.jks
            git commit -m "chore: add fixed release keystore (auto-generated, keep private)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
