plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yichi.kiosk'
    compileSdk 34

    defaultConfig {
        applicationId "com.yichi.kiosk"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // 签名配置：若工程根目录存在 keystore.properties 则读取，
    // 否则回退到内置默认密码（仅用于内部车间分发，非商用上架）
    signingConfigs {
        release {
            def propFile = rootProject.file("keystore.properties")
            if (propFile.exists()) {
                def props = new Properties()
                propFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else {
                storeFile rootProject.file("kiosk-release.jks")
                storePassword "kiosk2026"
                keyAlias "kiosk"
                keyPassword "kiosk2026"
            }
        }
    }

    buildTypes {
        debug {
            // debug 包也带上锁屏能力，方便先试
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // Android 10 / 11 上为支持写入 Download 目录
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

// 若签名文件不存在，跳过 release 签名而不是直接报错（允许单独打 debug 包）
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease')) {
        def ks = rootProject.file("kiosk-release.jks")
        if (!ks.exists()) {
            println "⚠️  未找到签名文件 kiosk-release.jks，release 包可能无法生成。"
            println "   请先在工程根目录执行 README 里的 keytool 命令生成，或改用 debug 包。"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
